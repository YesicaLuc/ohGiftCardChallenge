name: E2E Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Suite ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: report-${{ matrix.suite }}
          path: |
            cypress/reports
            cypress/screenshots
          if-no-files-found: ignore
